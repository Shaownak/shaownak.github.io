<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Shaownak Shahriar</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBFBF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0C0B" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.ico?v=2" sizes="32x32">
<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/main.css">
<script>
/* Same pre-paint theme read as index.html — a 404 that flashes white on a
   dark-themed visit looks broken rather than merely missing. */
(function(){var e=document.documentElement;e.classList.add("js");
try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")e.setAttribute("data-theme",t)}catch(_){}})();
</script>
<style>
  /* Local to this page: there is no bar and no sidebar, so the body padding
     the wide-screen rule adds on index.html must not apply here. */
  body{padding-left:0 !important}
  .nf{min-height:100svh;display:grid;place-content:center;text-align:center;padding:var(--gut)}
  .nf-code{font-family:var(--mono);font-size:clamp(56px,14vw,128px);font-weight:500;
           line-height:1;letter-spacing:-.04em;color:var(--sig);font-variant-numeric:tabular-nums}
  .nf h1{margin-top:var(--s5);font-size:clamp(22px,3.4vw,34px);font-weight:600;letter-spacing:-.028em}
  /* :not(.nf-code) — ".nf p" is (0,1,1) and would otherwise outrank the
     (0,1,0) ".nf-code" rule above it, rendering the numeral at body size. */
  .nf p:not(.nf-code){margin-top:var(--s4);font-size:16px;line-height:1.6;color:var(--ink-2);max-width:44ch;margin-inline:auto}
  .nf-back{
    display:inline-block;margin-top:var(--s6);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--sig);border:1px solid var(--sig-3);background:var(--sig-3);
    padding:10px var(--s5);text-decoration:none;
    transition:background-color .18s ease,border-color .18s ease;
  }
  .nf-back:hover{background:transparent;border-color:var(--sig)}
</style>
</head>
<body>
  <main class="nf">
    <p class="nf-code" aria-hidden="true">404</p>
    <h1>No such page</h1>
    <p>That address does not exist on this site. Nothing has been moved — it was
       most likely mistyped or linked from somewhere out of date.</p>
    <a class="nf-back" href="/">Back to the portfolio</a>
  </main>
</body>
</html>
